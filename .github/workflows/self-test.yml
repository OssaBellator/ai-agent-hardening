name: Self-test hardening action
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python -m unittest -v test_agent_hardening_check.py
      - name: Run local action
        uses: ./
        with:
          path: .
