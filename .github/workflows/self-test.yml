name: Self-test hardening action
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python -m unittest -v test_agent_hardening_check.py test_free_scan_issue.py
      - name: Run local action
        uses: ./
        with:
          path: .
      - name: Validate SARIF artifact
        run: |
          test -s agent-hardening-scan.sarif
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("agent-hardening-scan.sarif").read_text())
          assert data["version"] == "2.1.0"
          assert isinstance(data["runs"], list) and data["runs"]
          PY
